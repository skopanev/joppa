name: test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: joppa_test_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JOPPA_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/joppa_test_ci
    steps:
      - uses: actions/checkout@v4
      - run: bash -n server/*.sh && python3 tests/deploy.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --test oauth -- --ignored
      - run: cargo test --test sessions -- --ignored
      - run: cargo test --test postgres --test references --test sources --test authoring --test search --test consumers --test notes --test objects_postgres --test note_migration_postgres --test generic_tasks_postgres --test configured_references_postgres --test custom_verification_postgres --test schema_objects --test storage_rows --test incremental_projection -- --ignored --test-threads=1
      - run: cargo test --test access -- --ignored
        env:
          JOPPA_ACCESS_RULES_FILE: ${{ runner.temp }}/joppa-test-access.json
          JOPPA_LOGIN_USERS_FILE: ${{ runner.temp }}/joppa-test-aliases.json
      - run: cargo build --locked
      - run: python3 tests/http_smoke.py
