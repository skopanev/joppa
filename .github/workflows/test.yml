name: test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: joppa_test_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JOPPA_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/joppa_test_ci
    steps:
      - uses: actions/checkout@v4
      - name: Enable the journal query probe in the test database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d joppa_test_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d joppa_test_ci; then
              docker exec "$POSTGRES_CONTAINER" psql -U postgres -d joppa_test_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET pg_stat_statements.track = 'all'" -c 'SELECT pg_reload_conf()'
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: bash -n server/*.sh && python3 tests/deploy.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --test oauth -- --ignored
      - run: cargo test --test sessions -- --ignored
      - run: cargo test --test postgres --test references --test sources --test authoring --test search --test consumers --test notes --test objects_postgres --test note_migration_postgres --test generic_tasks_postgres --test configured_references_postgres --test custom_verification_postgres --test schema_objects --test storage_rows --test incremental_projection --test readiness_metadata --test journal_probe --test unstarted_work --test task_check_evidence_postgres --test reports_http --test spec_http -- --ignored --test-threads=1
      - run: cargo test --test access -- --ignored
        env:
          JOPPA_ACCESS_RULES_FILE: ${{ runner.temp }}/joppa-test-access.json
          JOPPA_LOGIN_USERS_FILE: ${{ runner.temp }}/joppa-test-aliases.json
      - run: cargo build --locked
      - run: python3 tests/http_smoke.py
      - uses: oven-sh/setup-bun@v2
      - run: bun tests/reports_smoke.ts
      - run: bun test scripts/joppa-report

      - run: python3 tests/task_check_reporting.py
