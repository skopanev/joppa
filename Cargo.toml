# joppa — дерево обязательств продукта: domain → capability → requirement → AC.
#
# Отдельный репозиторий, а не крейт внутри ntk, по одной причине: у них разная
# судьба. ntk — работающий инструмент с версией 0.5.x, joppa — прототип, который
# либо перерастёт его, либо умрёт. Пока он жил в чужом воркспейсе, он наследовал
# чужую версию и попадал в чужую сборку.
[package]
name = "joppa"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
