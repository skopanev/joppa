# joppa — дерево обязательств продукта: domain → capability → requirement → AC.
#
# Самостоятельное приложение со своим циклом сборки и выпуска.
[package]
name = "joppa"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"] }
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
sha2 = "0.11"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
quick-xml = "0.42.0"

# Test binaries keep file and line in backtraces, without full debug info.
# Full DWARF made 48 test binaries 5.4 GB and slowed every link.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
