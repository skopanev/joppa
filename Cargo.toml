# joppa — дерево обязательств продукта: domain → capability → requirement → AC.
#
# Самостоятельное приложение со своим циклом сборки и выпуска.
[package]
name = "joppa"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
