<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>joppa</title><link rel="icon" href="/favicon.svg">
<style>
:root{font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263729;background:#f5f5f0}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px}main{width:min(100%,440px)}.brand{font-weight:650;font-size:26px;letter-spacing:-.05em;display:flex;align-items:center;gap:10px}.brand img{width:26px;height:32px}h1{font-size:40px;line-height:1.15;letter-spacing:-.045em;font-weight:600;margin:42px 0 20px}p{color:#66726d}button{width:100%;border:0;border-radius:10px;background:#285f58;color:white;padding:16px;font-family:inherit;font-size:17px;font-weight:600;line-height:1.4;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #7f9b69;outline-offset:4px}#account,#callback{font-size:14px;overflow-wrap:anywhere}#status{font-size:15px;min-height:24px}a{color:#285f58}.client{padding:18px;background:#e4ece1;border-radius:10px;margin:24px 0;overflow-wrap:anywhere}.client strong{display:block;font-size:20px}small{display:block;color:#66726d;font-size:14px}
</style>
<main><div class="brand"><img src="/favicon.svg" alt="">joppa.</div><h1>Connect to Joppa.</h1><div class="client"><strong id="client">Your MCP client</strong><small id="callback"></small></div><p>Your agent will be able to read and update your workspaces on your behalf.</p><p id="account"></p><button id="connect" disabled>Checking sign-in…</button><p id="status" role="status" aria-live="polite"></p><a href="/">Cancel</a></main>
<script>
const button=document.getElementById('connect'),status=document.getElementById('status'),params=Object.fromEntries(new URLSearchParams(location.search));let signedIn=false;
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error_description||data.error||'Please try again.');return data;}
async function check(){try{const me=await api('/api/me');signedIn=true;document.getElementById('account').textContent='Signed in as '+(me.email||me.actor);button.textContent='Allow access';}catch{signedIn=false;button.textContent='Continue with Google';}button.disabled=false;}
button.onclick=async()=>{button.disabled=true;status.textContent='';let popup;try{
 if(!signedIn){popup=window.open('about:blank','joppa-google','popup,width=520,height=700');if(!popup)throw Error('Allow the sign-in window, then try again.');popup.opener=null;const start=await api('/auth/login',{});popup.location=start.verification_url;status.textContent='Complete sign-in in the Google window.';const deadline=Date.now()+start.expires_in*1000;while(Date.now()<deadline){await new Promise(r=>setTimeout(r,1500));const result=await api('/auth/poll',{});if(result.status==='ready'){popup.close();await check();status.textContent='Approve access to return to your agent.';return;}}throw Error('Sign-in expired. Please try again.');}
 const result=await api('/oauth/approve',params);button.textContent='Connected';status.textContent='Returning to your agent…';location.assign(result.redirect);
}catch(e){popup?.close();status.textContent=e.message;button.disabled=false;}};
(async()=>{try{const info=await api('/oauth/details'+location.search);document.getElementById('client').textContent=info.client_name;document.getElementById('callback').textContent='Return to '+new URL(info.redirect_uri).host;await check();}catch(e){button.textContent='Connection unavailable';status.textContent=e.message;}})();
</script></html>
