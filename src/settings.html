<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffcf5">
<script>
// The same theme as the board: an explicit choice in localStorage, else the system theme.
try{
  const theme=localStorage.getItem('theme');
  document.documentElement.dataset.theme=['light','dark'].includes(theme)?theme:'system';
}catch{document.documentElement.dataset.theme='system';}
</script>
<title>Settings · Joppa</title>
<link rel="icon" href="/favicon.svg">
<style>/* BOARD_STYLE */
/* BRAND_STYLE */
.settings{max-width:600px;margin:0 auto}
.settings h1{margin:.6em 0 .2em}
.settings section{padding:1.2em 0;border-top:1px solid var(--rule)}
.settings h2{font-size:1.1em;margin:0 0 .6em}
.settings label{margin:.2em 0 .3em}
.settings .row{display:flex;gap:.6rem;align-items:center}
.settings .row input,.settings .row select{flex:1;min-width:0;margin:0}
.settings .row button,.settings .action{border:1px solid var(--rule);padding:.45em .9em;color:var(--heading);white-space:nowrap}
.settings .row button:hover,.settings .action:hover{border-color:var(--text);text-decoration:none}
.settings [role=alert]:empty{display:none}
.settings [role=alert]{color:var(--fail);margin:.4em 0 0;font-size:.9em}
#workspace-people{list-style:none;margin:0 0 1em;padding:0}
#workspace-people li{padding:.75em 0;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
#workspace-people li:first-child{border-top:1px solid var(--rule)}
/* A people row: the name or address, and Remove at the end of the row. */
#workspace-people li{display:flex;align-items:center;gap:.6rem;justify-content:space-between}
#workspace-people li>span{min-width:0;overflow-wrap:anywhere}
#workspace-people li .remove{color:var(--muted);flex:none}
#workspace-people li .remove:hover{color:var(--fail)}
.owner-mark{color:var(--muted);font-size:.85em;flex:none}
#workspace-people li[data-kind=email],#workspace-people li[data-kind=domain]{color:var(--muted)}
#not-owner{color:var(--muted);margin:.6em 0 0}
.owner-block{margin-top:1.2em}
.danger{margin-top:1.6em;padding-top:1.2em;border-top:1px solid var(--rule)}
.settings .danger .action{color:var(--fail);border-color:var(--fail)}
#delete-confirm{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:0}
#delete-confirm[hidden]{display:none}
.back-link{color:var(--link);text-decoration:none;white-space:nowrap}
</style>
<body class="authenticated">
<header class="app-header">
  <a class="brand" href="/" aria-label="Joppa board"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><strong class="brand-word">joppa<span>.</span></strong></a>
  <label class="workspace-label"><span class="sr-only">Workspace</span><select id="workspace-select" name="workspace" aria-label="Workspace" disabled></select></label>
  <nav class="header-actions" aria-label="Account and display">
    <a id="back-link" class="back-link" href="/">← Back to board</a>
    <button id="theme" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
      <svg id="moon-svg" class="theme-icon theme-moon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg id="sun-svg" class="theme-icon theme-sun" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </button>
    <details id="account-menu">
      <summary id="identity"></summary>
      <div class="account-options">
        <a href="/">Board</a>
        <button id="logout" type="button">Sign out</button>
      </div>
    </details>
  </nav>
</header>
<main class="settings">
  <h1>Settings</h1>
  <section aria-labelledby="create-workspace-title">
    <h2 id="create-workspace-title">Create a workspace</h2>
    <form id="create-workspace">
      <label for="workspace-title">Workspace title</label>
      <div class="row"><input id="workspace-title" name="title" autocomplete="off"><button id="create-workspace-button" type="submit">Create</button></div>
      <p id="create-workspace-error" role="alert"></p>
    </form>
  </section>
  <section aria-labelledby="workspace-section-title">
    <h2 id="workspace-section-title">Workspace settings</h2>
    <p id="workspace-error" role="alert"></p>
    <div id="workspace-panel" hidden>
      <p id="not-owner" hidden>Only the owner of this workspace manages its people.</p>
      <div id="owner-panel" class="owner-block" hidden>
        <h2>People</h2>
        <ul id="workspace-people" aria-label="People with access"></ul>
        <form id="grant-access">
          <label for="grant-address">Email or domain</label>
          <div class="row"><input id="grant-address" name="address" autocomplete="off" placeholder="maria@example.com or example.com"><button id="grant-button" type="submit">Add</button></div>
          <p id="grant-error" role="alert"></p>
        </form>
        <form id="rename-workspace" class="owner-block">
          <label for="rename-title">New title</label>
          <div class="row"><input id="rename-title" name="title" autocomplete="off"><button id="rename-button" type="submit">Rename</button></div>
          <p id="rename-error" role="alert"></p>
        </form>
        <div id="delete-workspace" class="danger">
          <button id="delete-button" class="action" type="button">Delete workspace</button>
          <p id="delete-confirm" hidden><span>Delete this workspace for every member?</span> <button id="delete-confirm-button" class="action" type="button">Delete for everyone</button> <button id="delete-cancel-button" class="action" type="button">Cancel</button></p>
          <p id="delete-error" role="alert"></p>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
// The page reads two lists: the workspaces of the session and the owned workspaces with their
// people and grants. It reads no single workspace. People show by name and email; agents,
// member IDs and agent tokens stay off this page.
const $=id=>document.getElementById(id);
const element=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e;};
const send=async(url,method,body,failure)=>{
  const response=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body&&JSON.stringify(body)});
  const value=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(value.error||failure);
  return value;
};
// The theme button works as on the board.
const theme=$('theme'),systemTheme=window.matchMedia('(prefers-color-scheme: dark)');
const darkTheme=()=>{const selected=document.documentElement.dataset.theme;return selected==='dark'||selected==='system'&&systemTheme.matches;};
const updateTheme=()=>{
  const dark=darkTheme();
  theme.dataset.dark=String(dark);
  theme.title=dark?'Switch to light theme':'Switch to dark theme';
  theme.setAttribute('aria-label',theme.title);
  document.querySelector('meta[name="theme-color"]').content=dark?'#191c20':'#fffcf5';
};
theme.onclick=()=>{
  const next=darkTheme()?'light':'dark';
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem('theme',next);}catch{}
  updateTheme();
};
systemTheme.addEventListener('change',updateTheme);
updateTheme();
let workspaces=[],owned=[];
const select=$('workspace-select'),panel=$('workspace-panel');
const show=()=>{
  const id=select.value,own=owned.find(w=>w.id===id);
  // Back to board opens the selected workspace.
  $('back-link').href=id?'/?workspace='+encodeURIComponent(id):'/';
  panel.hidden=!id;
  $('not-owner').hidden=!!own;$('owner-panel').hidden=!own;
  // One list: members first, then emails that have not signed in yet, then whole domains.
  // Each row but the owner has Remove; the owner row says that it is the owner.
  const item=(kind,text,removal)=>{
    const li=document.createElement('li');li.dataset.kind=kind;li.append(element('span',text));
    if(removal){
      const button=element('button','Remove');button.type='button';button.className='remove';
      button.setAttribute('aria-label','Remove '+text);button.onclick=()=>remove(removal,button);li.append(button);
    }else{const mark=element('span','owner');mark.className='owner-mark';li.append(mark);}
    return li;
  };
  $('workspace-people').replaceChildren(...(own?.members||[]).map(m=>item('member',m.label,m.owner?null:{member:m.id})),
    ...(own?.emails||[]).map(e=>item('email',e+' (invited)',{email:e})),...(own?.domains||[]).map(d=>item('domain','Everyone at '+d,{domain:d})));
  $('rename-title').value=own?.title||'';
  for(const id of ['grant-error','rename-error','delete-error'])$(id).textContent='';
  $('delete-confirm').hidden=true;$('delete-button').hidden=false;
};
// A reload keeps the selection when the workspace is still listed.
const load=async selected=>{
  const [all,access]=await Promise.all([send('/api/workspaces','GET',undefined,'Could not load your workspaces.'),
    send('/api/access','GET',undefined,'Could not load owned workspaces.').then(v=>v.items,e=>e)]);
  workspaces=all;owned=access instanceof Error?[]:access;
  select.replaceChildren(...workspaces.map(w=>new Option(w.title,w.id)));
  if(workspaces.some(w=>w.id===selected))select.value=selected;
  select.disabled=!workspaces.length;
  $('workspace-error').textContent=access instanceof Error?access.message:'';
  show();
};
select.onchange=show;
// Remove takes one member, email or domain away from the selected workspace at once.
const remove=async(removal,button)=>{
  const workspace=select.value;
  button.disabled=true;$('grant-error').textContent='';
  try{
    await send('/api/access/remove','POST',{workspace,...removal},'Could not remove the access.');
    await load(workspace);
  }catch(e){$('grant-error').textContent=e.message;button.disabled=false;}
};
// The account menu shows the signed-in person, as on the board.
send('/api/me','GET',undefined,'').then(me=>{$('identity').textContent=me.name||me.email||me.actor||'Account';$('identity').title=me.email||'';},()=>{$('identity').textContent='Account';});
$('logout').onclick=async()=>{await fetch('/auth/logout',{method:'POST'});location.assign('/');};
document.addEventListener('click',event=>{if(!$('account-menu').contains(event.target))$('account-menu').open=false;},true);
load(sessionStorage.getItem('joppa-workspace')).catch(e=>{$('workspace-error').textContent=e.message;});
// One field adds an email or a whole domain: a value with "@" is an email, any other value is a domain.
$('grant-access').onsubmit=async event=>{
  event.preventDefault();
  const button=$('grant-button'),input=$('grant-address'),workspace=select.value;
  if(button.disabled)return;
  button.disabled=true;$('grant-error').textContent='';
  const value=input.value.trim(),email=value.includes('@');
  try{
    await send(email?'/api/email-grants':'/api/domain-grants','POST',email?{workspace,email:value}:{workspace,domain:value},
      email?'Could not add the person.':'Could not add the domain.');
    input.value='';
    await load(workspace);
  }catch(e){$('grant-error').textContent=e.message;}
  button.disabled=false;
};
$('rename-workspace').onsubmit=async event=>{
  event.preventDefault();
  const button=$('rename-button'),workspace=select.value;
  if(button.disabled)return;
  button.disabled=true;$('rename-error').textContent='';
  try{
    await send('/api/workspaces/'+encodeURIComponent(workspace)+'/rename','POST',{title:$('rename-title').value},'Could not rename the workspace.');
    await load(workspace);
  }catch(e){$('rename-error').textContent=e.message;}
  button.disabled=false;
};
// Delete asks once more on the page before it sends the request.
$('delete-button').onclick=()=>{$('delete-button').hidden=true;$('delete-confirm').hidden=false;};
$('delete-cancel-button').onclick=()=>{$('delete-confirm').hidden=true;$('delete-button').hidden=false;};
$('delete-confirm-button').onclick=async()=>{
  const button=$('delete-confirm-button'),workspace=select.value;
  button.disabled=true;$('delete-error').textContent='';
  try{
    await send('/api/workspaces/'+encodeURIComponent(workspace)+'/delete','POST',undefined,'Could not delete the workspace.');
    if(sessionStorage.getItem('joppa-workspace')===workspace)sessionStorage.removeItem('joppa-workspace');
    await load();
  }catch(e){$('delete-error').textContent=e.message;}
  button.disabled=false;
};
const form=$('create-workspace'),title=$('workspace-title'),create=$('create-workspace-button'),error=$('create-workspace-error');
form.onsubmit=async event=>{
  event.preventDefault();
  if(create.disabled)return;
  create.disabled=true;error.textContent='';
  try{
    const value=await send('/api/workspaces','POST',{title:title.value},'Could not create the workspace.');
    // The board opens the new workspace through its usual selection.
    sessionStorage.setItem('joppa-workspace',value.id);
    location.assign('/?workspace='+encodeURIComponent(value.id));
  }catch(e){error.textContent=e.message;create.disabled=false;}
};
</script>
</body>
</html>
