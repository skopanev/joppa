<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffcf5">
<script>
// The same theme as the board: an explicit choice in localStorage, else the system theme.
try{
  const theme=localStorage.getItem('theme');
  document.documentElement.dataset.theme=['light','dark'].includes(theme)?theme:'system';
}catch{document.documentElement.dataset.theme='system';}
</script>
<title>Settings · Joppa</title>
/* SOCIAL_META */
<link rel="icon" href="/favicon.svg">
<style>/* BOARD_STYLE */
/* BRAND_STYLE */
.settings{max-width:600px;margin:0 auto}
.settings h1{margin:.6em 0 .2em}
.settings section{padding:1.2em 0;border-top:1px solid var(--rule)}
.settings h2{font-size:1.1em;margin:0 0 .6em}
.settings label{margin:.2em 0 .3em}
.settings .row{display:flex;gap:.6rem;align-items:center}
.settings .row input,.settings .row select{flex:1;min-width:0;margin:0}
.settings .row button,.settings .action{border:1px solid var(--rule);padding:.45em .9em;color:var(--heading);white-space:nowrap}
.settings .row button:hover,.settings .action:hover{border-color:var(--text);text-decoration:none}
.settings [role=alert]:empty{display:none}
.settings [role=alert]{color:var(--fail);margin:.4em 0 0;font-size:.9em}
#workspace-people{list-style:none;margin:0 0 1em;padding:0}
#workspace-people li{padding:.75em 0;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
#workspace-people li:first-child{border-top:1px solid var(--rule)}
/* A people row: the name or address, and Remove at the end of the row. */
#workspace-people li{display:flex;align-items:center;gap:.6rem;justify-content:space-between}
#workspace-people li>span{min-width:0;overflow-wrap:anywhere}
#workspace-people li .remove{color:var(--muted);flex:none}
#workspace-people li .remove:hover{color:var(--fail)}
.owner-mark{color:var(--muted);font-size:.85em;flex:none}
#workspace-people li[data-kind=email],#workspace-people li[data-kind=domain]{color:var(--muted)}
#not-owner{color:var(--muted);margin:.6em 0 0}
.owner-block{margin-top:1.2em}
.danger{margin-top:1.6em;padding-top:1.2em;border-top:1px solid var(--rule)}
.settings .danger .action{color:var(--fail);border-color:var(--fail)}
#delete-confirm{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:0}
#delete-confirm[hidden]{display:none}
#delete-references{margin:0 0 .6em;color:var(--text)}
#delete-references ul{margin:.3em 0;padding-left:1.2em}

.back-link{color:var(--link);text-decoration:none;white-space:nowrap}
/* Rename and New workspace sit next to the workspace drop-down, as header controls. */
.icon-button{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;color:var(--muted);flex:none}
.icon-button:hover{color:var(--heading)}
.header-button{color:var(--link);white-space:nowrap;flex:none}
.drawer{padding:1em 0 1.2em;border-bottom:1px solid var(--rule)}
.drawer[hidden]{display:none}
.drawer .cancel{color:var(--muted);border-color:transparent}
</style>
<body class="authenticated">
<header class="app-header">
  <a class="brand" href="/" aria-label="Joppa board"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><strong class="brand-word">joppa<span>.</span></strong><span class="tagline">AI first product specification</span></a>
  <label class="workspace-label"><span class="sr-only">Workspace</span><select id="workspace-select" name="workspace" aria-label="Workspace" disabled></select></label>
  <button id="rename-open" class="icon-button" type="button" aria-label="Rename workspace" title="Rename workspace" hidden><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
  <button id="create-open" class="header-button" type="button">+ New workspace</button>
  <nav class="header-actions" aria-label="Account and display">
    <a id="back-link" class="back-link" href="/">← Back to board</a>
    <button id="theme" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
      <svg id="moon-svg" class="theme-icon theme-moon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg id="sun-svg" class="theme-icon theme-sun" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </button>
    <button id="logout" class="header-button" type="button">Sign out</button>
  </nav>
</header>
<main class="settings">
  <h1>Settings</h1>
  <form id="create-workspace" class="drawer" aria-labelledby="create-workspace-title" hidden>
    <h2 id="create-workspace-title">New workspace</h2>
    <label for="workspace-title">Workspace title</label>
    <div class="row"><input id="workspace-title" name="title" autocomplete="off"><button id="create-workspace-button" type="submit">Create</button><button class="cancel" type="button">Cancel</button></div>
    <p id="create-workspace-error" role="alert"></p>
  </form>
  <form id="rename-workspace" class="drawer" aria-labelledby="rename-workspace-title" hidden>
    <h2 id="rename-workspace-title">Rename workspace</h2>
    <label for="rename-title">New title</label>
    <div class="row"><input id="rename-title" name="title" autocomplete="off"><button id="rename-button" type="submit">Rename</button><button class="cancel" type="button">Cancel</button></div>
    <p id="rename-error" role="alert"></p>
  </form>
  <p id="workspace-error" role="alert"></p>
  <div id="workspace-panel" hidden>
    <p id="not-owner" hidden>Only the owner of this workspace manages its people.</p>
    <section id="owner-panel" aria-labelledby="people-title" hidden>
      <h2 id="people-title">People</h2>
      <ul id="workspace-people" aria-label="People with access"></ul>
      <form id="grant-access">
        <label for="grant-address">Email or domain</label>
        <div class="row"><input id="grant-address" name="address" autocomplete="off" placeholder="maria@example.com or example.com"><button id="grant-button" type="submit">Add</button></div>
        <p id="grant-error" role="alert"></p>
      </form>
      <div id="delete-workspace" class="danger">
        <button id="delete-button" class="action" type="button">Delete workspace</button>
        <div id="delete-references" hidden></div>
        <p id="delete-confirm" hidden><span>Delete this workspace and all of its data for every member? You cannot undo this.</span> <button id="delete-confirm-button" class="action" type="button">Delete for everyone</button> <button id="delete-cancel-button" class="action" type="button">Cancel</button></p>
        <p id="delete-error" role="alert"></p>
      </div>
    </section>
  </div>
</main>
<script>
// The page reads two lists: the workspaces of the session and the owned workspaces with their
// people and grants. It reads no single workspace. People show by name and email; agents,
// member IDs and agent tokens stay off this page.
const $=id=>document.getElementById(id);
const element=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e;};
// A long request disables its button and shows a spinner in it until the answer comes.
const busy=(button,on)=>{
  button.disabled=on;button.setAttribute('aria-busy',String(on));
  button.querySelector(':scope > .spinner')?.remove();
  if(on){const spin=document.createElement('span');spin.className='spinner';spin.setAttribute('aria-hidden','true');button.prepend(spin);}
};
const send=async(url,method,body,failure)=>{
  const response=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body&&JSON.stringify(body)});
  const value=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(value.error||failure);
  return value;
};
