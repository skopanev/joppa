<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffcf5">
<title>Settings · Joppa</title>
<link rel="icon" href="/favicon.svg">
<style>/* BOARD_STYLE */
/* BRAND_STYLE */
#member-workspaces li{overflow-wrap:anywhere}</style>
<body class="authenticated">
<header class="app-header">
  <a class="brand" href="/" aria-label="Joppa board"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><strong class="brand-word">joppa<span>.</span></strong><span class="tagline">AI first product specification</span></a>
</header>
<main class="layout">
  <h1>Settings</h1>
  <section aria-labelledby="member-workspaces-title">
    <h2 id="member-workspaces-title">Your workspaces</h2>
    <ul id="member-workspaces" aria-labelledby="member-workspaces-title" hidden></ul>
    <p id="member-workspaces-error" role="alert"></p>
  </section>
  <form id="create-workspace" aria-labelledby="create-workspace-title">
    <h2 id="create-workspace-title">Create a workspace</h2>
    <label>Workspace title <input id="workspace-title" name="title" autocomplete="off"></label>
    <button id="create-workspace-button" type="submit">Create</button>
    <p id="create-workspace-error" role="alert"></p>
  </form>
  <form id="grant-access" aria-labelledby="grant-access-title">
    <h2 id="grant-access-title">Add people to a workspace</h2>
    <label>Owned workspace <select id="grant-workspace" name="workspace"></select></label>
    <label>Email or domain <input id="grant-address" name="address" autocomplete="off" placeholder="maria@example.com or example.com"></label>
    <button id="grant-button" type="submit">Add</button>
    <p id="grant-error" role="alert"></p>
    <ul id="grant-emails" aria-label="Emails with access"></ul>
    <ul id="grant-domains" aria-label="Domains with access"></ul>
  </form>
</main>
<script>
// The page reads two lists: the workspaces of the session and the owned workspaces with their people.
// An owned entry lists its people by name and email; agents and member IDs stay off this page.
// The list appears once both reads have finished.
const element=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e;};
const read=async(url,failure)=>{
  const response=await fetch(url);
  const value=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(value.error||failure);
  return value;
};
const accessRead=()=>read('/api/access','Could not load owned workspaces.');
// The workspace list and the add form share the first read.
const firstAccess=accessRead();
(async()=>{
  const list=document.getElementById('member-workspaces'),error=document.getElementById('member-workspaces-error');
  try{
    const [workspaces,owned]=await Promise.all([read('/api/workspaces','Could not load your workspaces.'),
      firstAccess.then(v=>v.items,e=>e)]);
    list.replaceChildren(...workspaces.map(w=>{
      const entry=document.createElement('li'),title=element('span',w.title);
      title.className='workspace-title';entry.append(title);
      const own=owned instanceof Error?undefined:owned.find(o=>o.id===w.id);
      if(own){
        const people=document.createElement('ul');
        people.setAttribute('aria-label','Members of '+w.title);
        people.replaceChildren(...own.people.map(p=>element('li',p)));
        entry.append(people);
      }
      return entry;
    }));
    // A failed owned read keeps the workspace list and shows the server error once.
    if(owned instanceof Error)error.textContent=owned.message;
    list.hidden=false;
  }catch(e){error.textContent=e.message;}
})();
const form=document.getElementById('create-workspace'),title=document.getElementById('workspace-title'),
  create=document.getElementById('create-workspace-button'),error=document.getElementById('create-workspace-error');
form.onsubmit=async event=>{
  event.preventDefault();
  if(create.disabled)return;
  create.disabled=true;error.textContent='';
  try{
    const response=await fetch('/api/workspaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value})});
    const value=await response.json().catch(()=>({}));
    if(!response.ok)throw Error(value.error||'Could not create the workspace.');
    // The board opens the new workspace through its usual selection.
    sessionStorage.setItem('joppa-workspace',value.id);
    location.assign('/?workspace='+encodeURIComponent(value.id));
  }catch(e){error.textContent=e.message;create.disabled=false;}
};
// One field adds an email or a whole domain: a value with "@" is an email, any other value is a domain.
// Only workspaces that the server reports as owned are offered.
{
  const [form,select,input,button,error,emails,domains]=['grant-access','grant-workspace','grant-address','grant-button',
    'grant-error','grant-emails','grant-domains'].map(id=>document.getElementById(id));
  let owned=[];
  const show=()=>{
    const workspace=owned.find(w=>w.id===select.value);
    emails.replaceChildren(...(workspace?.emails||[]).map(text=>element('li',text)));
    domains.replaceChildren(...(workspace?.domains||[]).map(text=>element('li',text)));
  };
  const load=async(selected,reading=accessRead())=>{
    owned=(await reading).items;
    select.replaceChildren(...owned.map(w=>new Option(w.title,w.id)));
    if(owned.some(w=>w.id===selected))select.value=selected;
    button.disabled=!owned.length;
    show();
  };
  select.onchange=show;
  form.onsubmit=async event=>{
    event.preventDefault();
    if(button.disabled)return;
    button.disabled=true;error.textContent='';
    const workspace=select.value,value=input.value.trim(),email=value.includes('@');
    try{
      const response=await fetch(email?'/api/email-grants':'/api/domain-grants',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(email?{workspace,email:value}:{workspace,domain:value})});
      const reply=await response.json().catch(()=>({}));
      if(!response.ok)throw Error(reply.error||(email?'Could not add the person.':'Could not add the domain.'));
      input.value='';
      await load(workspace);
    }catch(e){error.textContent=e.message;button.disabled=false;}
  };
  button.disabled=true;
  load(undefined,firstAccess).catch(e=>{error.textContent=e.message;});
}
</script>
</body>
</html>
