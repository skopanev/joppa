<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffcf5">
<title>Settings · Joppa</title>
<link rel="icon" href="/favicon.svg">
<style>/* BOARD_STYLE */
/* BRAND_STYLE */</style>
<body class="authenticated">
<header class="app-header">
  <a class="brand" href="/" aria-label="Joppa board"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><strong class="brand-word">joppa<span>.</span></strong><span class="tagline">AI first product specification</span></a>
</header>
<main class="layout">
  <h1>Settings</h1>
  <form id="create-workspace" aria-labelledby="create-workspace-title">
    <h2 id="create-workspace-title">Create a workspace</h2>
    <label>Workspace title <input id="workspace-title" name="title" autocomplete="off"></label>
    <button id="create-workspace-button" type="submit">Create</button>
    <p id="create-workspace-error" role="alert"></p>
  </form>
  <form id="grant-email" aria-labelledby="grant-email-title">
    <h2 id="grant-email-title">Add a person to a workspace</h2>
    <label>Owned workspace <select id="grant-workspace" name="workspace"></select></label>
    <label>Google email <input id="grant-email-address" name="email" inputmode="email" autocomplete="off"></label>
    <button id="grant-email-button" type="submit">Add person</button>
    <p id="grant-email-error" role="alert"></p>
    <ul id="grant-emails" aria-label="Emails with access"></ul>
  </form>
  <form id="grant-domain" aria-labelledby="grant-domain-title">
    <h2 id="grant-domain-title">Add an email domain to a workspace</h2>
    <label>Workspace for the domain <select id="grant-domain-workspace" name="workspace"></select></label>
    <label>Email domain <input id="grant-domain-name" name="domain" autocomplete="off"></label>
    <button id="grant-domain-button" type="submit">Add domain</button>
    <p id="grant-domain-error" role="alert"></p>
    <ul id="grant-domains" aria-label="Domains with access"></ul>
  </form>
  <section id="agent-tokens" aria-labelledby="agent-tokens-title" hidden>
    <form id="issue-token">
      <h2 id="agent-tokens-title">Agent tokens</h2>
      <label>Workspace for the token <select id="token-workspace" name="workspace"></select></label>
      <label>Agent name <input id="token-agent" name="agent" autocomplete="off"></label>
      <label>Token access <select id="token-access" name="access"><option value="read">read</option><option value="write">write</option></select></label>
      <button id="issue-token-button" type="submit">Issue token</button>
      <p id="issue-token-error" role="alert"></p>
    </form>
    <div id="new-token" hidden>
      <p>Copy this token now. Joppa shows it only once.</p>
      <code id="new-token-value"></code>
      <button id="copy-token-button" type="button">Copy token</button>
    </div>
    <table aria-label="Agent tokens of the workspace">
      <thead><tr><th>Agent</th><th>Access</th><th>Status</th><th>Created</th><th>Revoked</th></tr></thead>
      <tbody id="agent-token-list"></tbody>
    </table>
  </section>
</main>
<script>
const form=document.getElementById('create-workspace'),title=document.getElementById('workspace-title'),
  create=document.getElementById('create-workspace-button'),error=document.getElementById('create-workspace-error');
form.onsubmit=async event=>{
  event.preventDefault();
  if(create.disabled)return;
  create.disabled=true;error.textContent='';
  try{
    const response=await fetch('/api/workspaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value})});
    const value=await response.json().catch(()=>({}));
    if(!response.ok)throw Error(value.error||'Could not create the workspace.');
    // The board opens the new workspace through its usual selection.
    sessionStorage.setItem('joppa-workspace',value.id);
    location.assign('/?workspace='+encodeURIComponent(value.id));
  }catch(e){error.textContent=e.message;create.disabled=false;}
};
// Only workspaces that the server reports as owned are offered.
// The email and domain forms differ only in their elements, endpoint and field.
const grantForm=(ids,endpoint,field,failure)=>{
  const [form,select,input,button,error,list]=ids.map(id=>document.getElementById(id));
  let owned=[];
  const show=()=>{
    const workspace=owned.find(w=>w.id===select.value);
    list.replaceChildren(...(workspace?.[field+'s']||[]).map(text=>{const li=document.createElement('li');li.textContent=text;return li;}));
  };
  const load=async selected=>{
    const response=await fetch(endpoint);
    const value=await response.json().catch(()=>({}));
    if(!response.ok)throw Error(value.error||'Could not load owned workspaces.');
    owned=value.items;
    select.replaceChildren(...owned.map(w=>new Option(w.title,w.id)));
    if(owned.some(w=>w.id===selected))select.value=selected;
    button.disabled=!owned.length;
    show();
  };
  select.onchange=show;
  form.onsubmit=async event=>{
    event.preventDefault();
    if(button.disabled)return;
    button.disabled=true;error.textContent='';
    const workspace=select.value;
    try{
      const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace,[field]:input.value})});
      const value=await response.json().catch(()=>({}));
      if(!response.ok)throw Error(value.error||failure);
      input.value='';
      await load(workspace);
    }catch(e){error.textContent=e.message;button.disabled=false;}
  };
  button.disabled=true;
  load().catch(e=>{error.textContent=e.message;});
};
grantForm(['grant-email','grant-workspace','grant-email-address','grant-email-button','grant-email-error','grant-emails'],
  '/api/email-grants','email','Could not add the person.');
grantForm(['grant-domain','grant-domain-workspace','grant-domain-name','grant-domain-button','grant-domain-error','grant-domains'],
  '/api/domain-grants','domain','Could not add the domain.');
// The whole token section stays hidden unless the server reports an owned workspace.
// A new token value lives only in this page's memory; a reload drops it.
{
  const [section,form,select,agent,access,button,error,shown,value,copy,list]=['agent-tokens','issue-token','token-workspace',
    'token-agent','token-access','issue-token-button','issue-token-error','new-token','new-token-value','copy-token-button',
    'agent-token-list'].map(id=>document.getElementById(id));
  const json=async(response,failure)=>{
    const value=await response.json().catch(()=>({}));
    if(!response.ok)throw Error(value.error||failure);
    return value;
  };
  const tokens=()=>'/api/workspaces/'+encodeURIComponent(select.value)+'/agent-tokens';
  const show=async()=>{
    const {items}=await json(await fetch(tokens()),'Could not load the agent tokens.');
    list.replaceChildren(...items.map(t=>{
      const row=document.createElement('tr');
      row.replaceChildren(...[t.agent,t.access,t.revoked?'revoked':'active',t.created_at,t.revoked_at||''].map(text=>{
        const cell=document.createElement('td');cell.textContent=text;return cell;
      }));
      return row;
    }));
  };
  const hide=()=>{shown.hidden=true;value.textContent='';};
  select.onchange=()=>{hide();error.textContent='';show().catch(e=>{error.textContent=e.message;});};
  copy.onclick=async()=>{
    try{await navigator.clipboard.writeText(value.textContent);copy.textContent='Copied';}
    catch{error.textContent='Could not copy the token. Select it and copy it by hand.';}
  };
  form.onsubmit=async event=>{
    event.preventDefault();
    if(button.disabled)return;
    button.disabled=true;error.textContent='';hide();
    try{
      const created=await json(await fetch(tokens(),{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({agent:agent.value,access:access.value})}),'Could not issue the token.');
      value.textContent=created.token;copy.textContent='Copy token';shown.hidden=false;
      agent.value='';
      await show();
    }catch(e){error.textContent=e.message;}
    button.disabled=false;
  };
  button.disabled=true;
  fetch('/api/email-grants').then(r=>json(r,'Could not load owned workspaces.')).then(({items})=>{
    if(!items.length){section.remove();return;}
    select.replaceChildren(...items.map(w=>new Option(w.title,w.id)));
    section.hidden=false;button.disabled=false;
    return show();
  }).catch(e=>{section.hidden=false;error.textContent=e.message;});
}
</script>
</body>
</html>
